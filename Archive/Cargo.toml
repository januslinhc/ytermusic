[package]
name = "ytermusic"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A keyboard-first YouTube Music terminal player"
license = "MIT"

[features]
default = []
live-tests = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4.1.5"
rand = "0.9"
rand_chacha = "0.9"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled", "serde_json", "uuid"] }
rustfft = "6"
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2.0.19"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.24"
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
which = "8"
ytmapi-rs = { version = "0.3.2", default-features = false, features = ["reqwest", "rustls", "serde_json", "simplified-queries"] }

# XDG uses Tokio-backed zbus and its non-decoding image-path hint; macOS uses
# the current UserNotifications backend. Platform code remains cfg-isolated.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.18.0", default-features = false, features = ["z-with-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18.0", default-features = false, features = ["preview-macos-un"] }

# WinRT toast APIs and local image attachments are compiled only on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
winrt-toast-reborn = "0.3.8"

[dev-dependencies]
assert_cmd = "2"
insta = "1.48.0"
predicates = "3"
proptest = "1.11.0"
serial_test = "3"

[[test]]
name = "provider_live"
path = "tests/live/provider_live.rs"
required-features = ["live-tests"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
